name: Publish Linux release

# Tags are built and published together; normal branch CI is not duplicated.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to Cargo.toml version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ -n "$version" ]] || { echo 'Could not read Cargo.toml version' >&2; exit 1; }
          [[ -s Cargo.lock ]] || { echo 'Commit Cargo.lock before publishing a tagged release.' >&2; exit 1; }
          if [[ "$RELEASE_TAG" != "v${version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match Cargo.toml version v${version}" >&2
            exit 1
          fi
          echo "Validated version: ${RELEASE_TAG}"

  build-linux:
    name: Check and build Linux packages
    needs: validate-tag
    uses: ./.github/workflows/rust.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

  publish-flatpak-pages:
    name: Publish signed Flatpak remote on GitHub Pages
    needs: build-linux
    # Opt-in so the existing immutable release workflow keeps working until
    # Pages and its dedicated GPG key have been explicitly configured.
    if: ${{ vars.FLATPAK_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: print-creator-flatpak-pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    # Settings > Environments > github-pages must explicitly allow Tag: v*.
    # GitHub rejects tag-triggered Pages deployments before any step executes
    # unless the environment's deployment branches/tags rules permit them.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install OSTree repository utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree gnupg
      - name: Download the already-built release Flatpak
        uses: actions/download-artifact@v4
        with:
          name: print-creator-linux-x86_64
          path: dist/packages
      - name: Verify Flatpak checksum and set repository URL
        id: repo_url
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/packages && sha256sum --check --strict SHA256SUMS)
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          owner="${owner,,}"
          if [[ "${repository,,}" == "${owner}.github.io" ]]; then
            default_url="https://${owner}.github.io/"
          else
            default_url="https://${owner}.github.io/${repository}/"
          fi
          # Set this repository variable only if you use a GitHub Pages custom domain.
          url="${FLATPAK_PAGES_URL:-$default_url}"
          [[ "$url" == https://* ]] || { echo 'Flatpak repository URL must use HTTPS' >&2; exit 1; }
          echo "url=${url%/}/" >> "$GITHUB_OUTPUT"
        env:
          FLATPAK_PAGES_URL: ${{ vars.FLATPAK_PAGES_URL }}
      - name: Import dedicated Flatpak signing key
        env:
          FLATPAK_SIGNING_KEY_B64: ${{ secrets.FLATPAK_SIGNING_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${FLATPAK_SIGNING_KEY_B64:-}" ]] || {
            echo 'Set the encrypted FLATPAK_SIGNING_KEY_B64 Actions secret first.' >&2
            exit 1
          }
          export GNUPGHOME="${RUNNER_TEMP}/print-creator-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$FLATPAK_SIGNING_KEY_B64" | base64 --decode | gpg --batch --import
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          [[ -n "$fingerprint" ]] || { echo 'No secret GPG signing key was imported' >&2; exit 1; }
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          echo "FLATPAK_GPG_KEY_ID=${fingerprint}" >> "$GITHUB_ENV"
      - name: Restore persistent OSTree history from gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          pages="${RUNNER_TEMP}/flatpak-pages"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --no-tags --depth=1 origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git worktree add --detach "$pages" refs/remotes/origin/gh-pages
            git -C "$pages" switch -c gh-pages
          else
            git worktree add --detach "$pages" HEAD
            git -C "$pages" switch --orphan gh-pages
          fi
          echo "PAGES_WORKTREE=${pages}" >> "$GITHUB_ENV"
      - name: Sign, import and publish an updated Flatpak repository
        env:
          REPOSITORY_URL: ${{ steps.repo_url.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(dist/packages/*.flatpak)
          (( ${#bundles[@]} == 1 )) || { echo 'Expected exactly one Flatpak bundle' >&2; exit 1; }
          ./scripts/update-flatpak-pages.sh "$PAGES_WORKTREE" "${bundles[0]}" "$REPOSITORY_URL"
          # GitHub Pages published-site hard limit: 1 GB.
          bytes="$(du -sb "$PAGES_WORKTREE" | cut -f1)"
          if (( bytes > 950000000 )); then
            echo "Flatpak repository (${bytes} bytes) is too large for GitHub Pages." >&2
            exit 1
          fi
          git -C "$PAGES_WORKTREE" config user.name 'github-actions[bot]'
          git -C "$PAGES_WORKTREE" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$PAGES_WORKTREE" add --all
          if ! git -C "$PAGES_WORKTREE" diff --cached --quiet; then
            git -C "$PAGES_WORKTREE" commit -m "Publish Print Creator ${GITHUB_REF_NAME} Flatpak repository"
            git -C "$PAGES_WORKTREE" push origin HEAD:refs/heads/gh-pages
          fi
      - name: Prepare clean GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/flatpak-pages-public"
          cp -a "${PAGES_WORKTREE}/." "${RUNNER_TEMP}/flatpak-pages-public/"
          rm -f "${RUNNER_TEMP}/flatpak-pages-public/.git"
          test -s "${RUNNER_TEMP}/flatpak-pages-public/summary.sig"
          test -s "${RUNNER_TEMP}/flatpak-pages-public/index.flatpakrepo"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/flatpak-pages-public
      - name: Deploy signed remote to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Create GitHub Release
    # Pages is an optional update channel. An environment-protection mistake
    # there must not block the immutable, signed GitHub Release artifacts.
    needs: build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Flatpak and AppImage from this run
        uses: actions/download-artifact@v4
        with:
          name: print-creator-linux-x86_64
          path: dist/packages

      - name: Verify downloaded packages against build-time checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          flatpaks=(dist/packages/*.flatpak)
          appimages=(dist/packages/*.AppImage)
          if (( ${#flatpaks[@]} != 1 || ${#appimages[@]} != 1 )); then
            echo 'Expected exactly one Flatpak and one AppImage:' >&2
            ls -lah dist/packages/ >&2 || true
            exit 1
          fi
          [[ -s dist/packages/SHA256SUMS ]] || { echo 'Missing build-time checksums' >&2; exit 1; }
          (cd dist/packages && sha256sum --check --strict SHA256SUMS)
          ls -lh dist/packages/*

      # GitHub Immutable Releases lock assets as soon as a draft is published.
      # Upload all assets to the draft, inspect it, then publish once.
      - name: Create draft with all release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A release for $RELEASE_TAG already exists; refusing to replace immutable assets." >&2
            exit 1
          fi
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            dist/packages/*.flatpak dist/packages/*.AppImage dist/packages/SHA256SUMS \
            --verify-tag --draft --generate-notes \
            --title "Print Creator $RELEASE_TAG" "${prerelease[@]}"

      - name: Verify all assets are attached to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="$(find dist/packages -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          if [[ "$expected" != "$actual" ]]; then
            echo 'Release draft assets do not match the build output.' >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Publish completed immutable-compatible release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false
          echo "Published $RELEASE_TAG. Verify immutability with: gh release verify $RELEASE_TAG"
