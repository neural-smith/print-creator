name: Rust checks and Linux packages

on:
  # Only branch pushes run normal CI. Tags are handled by release.yml,
  # which calls this same workflow to avoid running builds twice.
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev libssl-dev
      - name: Check desktop and CLI
        run: cargo check --all-targets --all-features
      - name: Run tests
        run: cargo test --all-features
      - name: Headless CLI build
        run: cargo check --no-default-features
      - name: Verify shell packaging scripts
        run: bash -n scripts/*.sh
      - name: Verify shell script executable bits are committed
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do
            mode="$(git ls-files --stage -- "$script" | awk '{print $1}')"
            [[ "$mode" == 100755 ]] || {
              echo "Expected Git mode 100755 for $script (got ${mode:-untracked})" >&2
              exit 1
            }
          done
      - name: Verify author metadata and Flatpak Pages index generation
        run: python3 -m unittest discover -s tests -p "test_*.py"

  packages:
    runs-on: ubuntu-24.04
    # Build provenance is signed only for tagged releases (never on fork PRs).
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak flatpak-builder ostree patchelf desktop-file-utils file curl \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libasound2-dev libssl-dev libfuse2t64
          flatpak remote-add --user --if-not-exists \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Validate desktop integration
        run: |
          python3 scripts/generate-metadata.py --output-dir dist/desktop
          desktop-file-validate dist/desktop/org.neural_smith.PrintCreator.desktop
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('dist/desktop/org.neural_smith.PrintCreator.metainfo.xml')"
      - name: Build Flatpak and AppImage
        # Run explicitly via Bash as a safeguard against ZIP extraction removing the executable bit.
        run: bash ./scripts/build-all.sh
      - name: Confirm Linux packages and standalone binary exist
        shell: bash
        run: |
          shopt -s nullglob
          flatpaks=(dist/packages/*.flatpak)
          appimages=(dist/packages/*.AppImage)
          binaries=(dist/packages/PrintCreator-*-linux)
          [[ ${#flatpaks[@]} == 1 && ${#appimages[@]} == 1 && ${#binaries[@]} == 1 ]]
          [[ -x "${binaries[0]}" ]]
          ls -lh "${flatpaks[@]}" "${appimages[@]}" "${binaries[@]}"
      - name: Generate and verify package checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          flatpaks=(dist/packages/*.flatpak)
          appimages=(dist/packages/*.AppImage)
          binaries=(dist/packages/PrintCreator-*-linux)
          if (( ${#flatpaks[@]} != 1 || ${#appimages[@]} != 1 || ${#binaries[@]} != 1 )); then
            echo 'Expected exactly one Flatpak, one AppImage and one standalone binary' >&2
            exit 1
          fi
          (cd dist/packages && sha256sum -- *.flatpak *.AppImage *-linux > SHA256SUMS)
          (cd dist/packages && sha256sum --check SHA256SUMS)
      - name: Archive the already-built unsigned Flatpak OSTree repository
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/flatpak-repo/config
          ostree --repo=dist/flatpak-repo rev-parse app/org.neural_smith.PrintCreator/x86_64/master
          tar -C dist/flatpak-repo -czf dist/flatpak-ostree-repo.tar.gz .
          tar -tzf dist/flatpak-ostree-repo.tar.gz > /dev/null
      - name: Upload Flatpak OSTree repository for Pages (not a public release asset)
        uses: actions/upload-artifact@v4
        with:
          name: print-creator-flatpak-ostree-x86_64
          path: dist/flatpak-ostree-repo.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Attest Linux release artifacts (signed SLSA build provenance)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: 'dist/packages/*'
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: print-creator-linux-x86_64
          path: |
            dist/packages/*.flatpak
            dist/packages/*.AppImage
            dist/packages/*-linux
            dist/packages/SHA256SUMS
          if-no-files-found: error
