[package]
name = "print-creator"
version = "0.5.3"
edition = "2021"
authors = ["neural-smith"]
license = "GPL-2.0-or-later"
description = "Standalone photo print-layout creator compatible with digiKam Print Creator XML templates"
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]
# Web uses the exact same layout and PDF engines as desktop, with browser adapters.
web = ["dep:eframe", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys", "dep:base64", "dep:font8x8", "dep:console_error_panic_hook"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", features = ["jpeg", "png", "tiff", "webp", "bmp"] }
flate2 = "1.0"
kamadak-exif = "0.6"
roxmltree = "0.20"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
imageproc = "0.25"
ab_glyph = "0.2"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
rfd = { version = "0.15", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlCanvasElement", "Element", "Location"], optional = true }
base64 = { version = "0.22", optional = true }
font8x8 = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }


[dev-dependencies]
tempfile = "3.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Skip bundled Binaryen; keep Rust release optimizations.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
