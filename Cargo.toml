[package]
name = "print-creator"
version = "0.4.6"
edition = "2021"
authors = ["neural-smith"]
license = "GPL-2.0-or-later"
description = "Standalone photo print-layout creator compatible with digiKam Print Creator XML templates"
readme = "README.md"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", features = ["jpeg", "png", "tiff", "webp", "bmp"] }
imageproc = "0.25"
flate2 = "1.0"
ab_glyph = "0.2"
kamadak-exif = "0.6"
roxmltree = "0.20"
walkdir = "2.5"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
rfd = { version = "0.15", optional = true }

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
